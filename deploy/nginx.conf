# /etc/nginx/sites-available/default
# La EC2 solo expone la API; el frontend vive en Azure Static Web Apps.
# Certbot añade el bloque 443 (HTTPS) y la redirección desde el 80.

upstream backend_empleados {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name empleados-miguel.duckdns.org;

    # API REST y Swagger (/api/v1/..., /api/docs)
    location /api/ {
        proxy_pass http://backend_empleados;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
