# /etc/nginx/sites-available/default
# La EC2 solo expone la API; el frontend vive en Azure Static Web Apps.
# Versión final tras "certbot --nginx": 443 con Let's Encrypt y redirección 80 → 443.
# Para una instalación nueva, quita las líneas "managed by Certbot" y deja que Certbot las regenere.

upstream backend_empleados {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name empleados-miguel.duckdns.org;

    # API REST y Swagger (/api/v1/..., /api/docs)
    location /api/ {
        proxy_pass http://backend_empleados;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La raíz del dominio de la API lleva a la documentación
    location = / {
        return 302 /api/docs/;
    }

    # El frontend vive en Azure: aquí no se sirve nada más
    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/empleados-miguel.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/empleados-miguel.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = empleados-miguel.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name empleados-miguel.duckdns.org;
    return 404; # managed by Certbot


}