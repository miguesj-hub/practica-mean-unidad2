<div class="container py-4">

  <div class="row mb-4">
    <div class="col">
      <h1 class="display-6">Gestión de Empleados</h1>
      <p class="text-muted">Unidad 2 — Arquitectura y Patrones de Diseño de APIs</p>
    </div>
  </div>

  <app-notice-banner [notice]="notice$ | async" (dismiss)="onDismiss()" />

  <div class="row">
    <div class="col-md-4">
      @if (draft$ | async; as draft) {
        <app-employee-form
          [draft]="draft"
          [editing]="(editingId$ | async) !== null"
          [saving]="(loading$ | async) ?? false"
          (save)="onSave($event)"
          (cancel)="onCancel()" />
      }
    </div>

    <div class="col-md-8">
      <app-employee-grid
        [empleados]="(employees$ | async) ?? []"
        [loading]="(loading$ | async) ?? false"
        [total]="(total$ | async) ?? 0"
        (edit)="onEdit($event)"
        (remove)="onRemove($event)"
        (reload)="onReload()" />
    </div>
  </div>
</div>
